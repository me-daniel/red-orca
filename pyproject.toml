[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vsw"
version = "0.1.0"
description = "Vorsprung Security Workbench: bounded, evidence-first security testing"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.13,<3",
  "typer>=0.25,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "playwright>=1.50,<2",
  "httpx>=0.28,<1",
  "PyYAML>=6,<7",
  "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
  "mypy>=1.13,<2",
]

[project.scripts]
vsw = "vsw.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vsw = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["vsw"]

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20261111",
]
