# Company engagement template. Non-executable until a human fills in every
# field and runs `vsw engagement approve`. Do not edit an approved manifest:
# any material change invalidates approval and requires re-approval.
id: company-example
owner: security-team
approver: pending-human-approval
authorization_ref: "WRITTEN AUTHORIZATION REQUIRED"
profile: observe
expires_at: "1970-01-01T00:00:00Z"
origins:
  - https://staging.example.invalid
methods:
  - GET
path_prefixes:
  - /
exclude_paths:
  - /account/delete
  - /logout
  - /admin
mutation_allowed: false
max_requests: 100
max_rps: 1.0
max_wall_seconds: 900
max_concurrency: 1
approval:
  approved: false
  approved_by: null
  approved_at: null
  approved_manifest_sha256: null
