    <path id="finM" d="M250 82 C268 52 290 10 306 -12 C311 -19 317 -14 316 -4 C313 28 322 62 350 88 Z"/>
    <path id="finF" d="M260 82 C282 60 304 42 326 36 C332 35 334 40 331 46 C324 60 330 76 348 88 Z"/>
    <path id="pec" d="M198 214 C218 240 238 268 246 292 C248 302 238 305 228 299 C200 284 172 256 158 226 C154 218 151 210 149 202 Z"/>
    <clipPath id="clip"><use href="#trunk"/></clipPath>
    <path id="backM" d="M2 166 C12 140 55 112 120 98 C170 88 215 82 252 80 C268 52 290 10 306 -12 C311 -19 317 -14 316 -4" fill="none"/>
    <path id="backF" d="M2 166 C12 140 55 112 120 98 C170 88 215 82 260 81 C282 60 304 42 326 36" fill="none"/>
    <path id="tailrim" d="M520 118 C548 123 570 122 590 112 C606 100 626 80 640 62" fill="none"/>

    <g id="marks">
