<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Red Orca Pod — many models, one pod">
  <style>
    @keyframes bob { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-5px,-7px) } }
    @keyframes bob2 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(4px,6px) } }
    @keyframes rise { 0% { transform: translate(0,14px); opacity:0 } 25% { opacity:.7 } 100% { transform: translate(10px,-70px); opacity:0 } }
    @keyframes ping { 0%,100% { opacity:.12 } 30% { opacity:1 } }
    @keyframes shimmer { 0%,100% { opacity:.55 } 50% { opacity:1 } }
    @keyframes pulse { 0%,100% { opacity:.55 } 50% { opacity:.95 } }
    @keyframes drift { 0%,100% { transform: translate(0,0) } 50% { transform: translate(9px,-6px) } }
    @keyframes swell { 0%,100% { transform: translateX(0) } 50% { transform: translateX(-26px) } }
    .lead { animation: bob 7s ease-in-out infinite }
    .m1 { animation: bob2 6s ease-in-out infinite } .m2 { animation: bob 8s ease-in-out infinite -2s }
    .m3 { animation: bob2 9s ease-in-out infinite -4s } .m4 { animation: bob 10s ease-in-out infinite -1s }
    .bub { animation: rise 4.5s linear infinite } .b1 { animation-delay:-1.5s } .b2 { animation-delay:-3s }
    .ping { animation: ping 2.6s ease-out infinite } .p1 { animation-delay:.25s } .p2 { animation-delay:.5s }
    .rays { animation: shimmer 9s ease-in-out infinite } .eyeglow { animation: pulse 3.2s ease-in-out infinite }
    .drift { animation: drift 11s ease-in-out infinite } .d1 { animation-duration:14s; animation-delay:-3s }
    .d2 { animation-duration:17s; animation-delay:-6s } .d3 { animation-duration:9s; animation-delay:-2s }
    .swell { animation: swell 12s ease-in-out infinite } .school { animation: bob2 5s ease-in-out infinite }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a1220"/>
      <stop offset="0.22" stop-color="#4a0b17"/>
      <stop offset="0.6" stop-color="#1f060d"/>
      <stop offset="1" stop-color="#080204"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.72" cy="-0.05" r="0.75">
      <stop offset="0" stop-color="#ff7a5c" stop-opacity="0.95"/>
      <stop offset="0.3" stop-color="#e0283a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#b0182a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.72" cy="0.46" r="0.45">
      <stop offset="0" stop-color="#c8283a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#c8283a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#080204" stop-opacity="0.8"/>
      <stop offset="0.28" stop-color="#080204" stop-opacity="0.55"/>
      <stop offset="0.44" stop-color="#080204" stop-opacity="0.2"/>
      <stop offset="0.58" stop-color="#080204" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb49c" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffb49c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1218"/>
      <stop offset="0.35" stop-color="#0d0709"/>
      <stop offset="1" stop-color="#050304"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#1a0408" stop-opacity="0"/>
      <stop offset="1" stop-color="#1a0408" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc2b4" stop-opacity="0.85"/>
      <stop offset="0.7" stop-color="#ff9a8a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff9a8a" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="hot" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#ff9a84"/>
      <stop offset="0.5" stop-color="#ff3246"/>
      <stop offset="1" stop-color="#d0162c"/>
    </radialGradient>
    <filter id="soft" x="-80%" y="-200%" width="260%" height="500%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="blur1"><feGaussianBlur stdDeviation="1.2"/></filter>

    <!-- orca, facing left, local box 0..670 x -20..305 -->
