        <path d="M-10 177 C40 190 100 200 150 204 C210 210 270 212 330 206 C370 200 398 186 420 168
                 C438 154 456 148 476 148 C462 160 452 176 470 184 C500 190 540 166 580 146 L600 138 L600 330 L-10 330 Z" fill="#f6ebe7"/>
