      <use href="#pec" fill="#070405"/>
      <path d="M198 214 C218 240 238 268 246 292" fill="none" stroke="#ff9a8a" stroke-opacity="0.35" stroke-width="1.5"/>
      <path d="M342 96 C374 94 414 106 438 122 C406 118 370 114 346 110 Z" fill="#b89a9c" opacity="0.5"/>
      <path d="M6 176 C30 181 54 180 74 173" fill="none" stroke="#000" stroke-opacity="0.5" stroke-width="1.4"/>
      <use href="#tailrim" stroke="#ff9a8a" stroke-opacity="0.5" stroke-width="2"/>
    </g>

    <g id="orca">
      <use href="#finF" fill="#0d0709"/><use href="#trunk" fill="url(#body)"/>
      <use href="#marks"/>
      <ellipse cx="104" cy="136" rx="28" ry="11" transform="rotate(-12 104 136)" fill="#f6ebe7"/>
      <use href="#backF" stroke="url(#rim)" stroke-width="3"/>
    </g>
    <g id="lead">
      <use href="#finM" fill="#0d0709"/><use href="#trunk" fill="url(#body)"/>
      <use href="#marks"/>
      <ellipse class="eyeglow" cx="104" cy="136" rx="40" ry="18" transform="rotate(-12 104 136)" fill="#ff3246" opacity="0.8" filter="url(#soft)"/>
      <ellipse cx="104" cy="136" rx="28" ry="11" transform="rotate(-12 104 136)" fill="url(#hot)"/>
      <circle cx="67" cy="153" r="2.6" fill="#3a1c22"/><circle cx="66.3" cy="152.3" r="0.8" fill="#ffd0c4"/>
      <use href="#backM" stroke="url(#rim)" stroke-width="1.8"/>
    </g>
    <path id="fish" d="M0 0 C5 -3.2 13 -3.2 19 0 L25 -3.5 L24 0 L25 3.5 L19 0 C13 3.2 5 3.2 0 0 Z" fill="#ffb7a6"/>
  </defs>

